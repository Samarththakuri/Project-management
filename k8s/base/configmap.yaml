# Non-sensitive runtime configuration.
#
# The split is strict: anything here is safe in git forever. Anything that is not
# lives in the Kubernetes Secret `projectcamp-backend-secrets`, which is created
# by hand with kubectl and never committed. MONGO_URI, the token signing secrets
# and the SMTP credentials are never in this ConfigMap.
#
# Both are mounted the same way, via envFrom in backend-deployment.yaml, so the
# application sees one flat set of environment variables and does not care which
# object each value came from.
apiVersion: v1
kind: ConfigMap
metadata:
  name: projectcamp-config
  labels:
    app.kubernetes.io/name: projectcamp
data:
  PORT: "8000"

  # Makes the auth cookies Secure. Correct only when traffic actually arrives over
  # HTTPS - which is why enabling the overlay TLS patch matters for real use.
  NODE_ENV: "production"

  # Overridden per overlay, and load-bearing in two ways: it is the CORS allowlist
  # AND the base URL the backend uses to build emailed verification and
  # password-reset links. If it does not match the hostname users actually visit,
  # those emails point somewhere broken.
  CORS_ORIGIN: "http://localhost:5173"

  ACCESS_TOKEN_EXPIRY: "15m"
  REFRESH_TOKEN_EXPIRY: "10d"

  # Enables the /metrics endpoint the ServiceMonitor scrapes.
  METRICS_ENABLED: "true"
