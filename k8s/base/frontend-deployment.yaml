apiVersion: apps/v1
kind: Deployment
metadata:
  name: projectcamp-frontend
  labels:
    app.kubernetes.io/name: projectcamp
    app.kubernetes.io/component: frontend
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: projectcamp
      app.kubernetes.io/component: frontend

  progressDeadlineSeconds: 300
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: projectcamp
        app.kubernetes.io/component: frontend
    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        # 101 is the nginx user baked into nginx-unprivileged. That image is used
        # precisely so this works: stock nginx starts as root to bind :80 and
        # would be rejected outright by runAsNonRoot.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: projectcamp
              app.kubernetes.io/component: frontend

      containers:
        - name: frontend
          # Rewritten by CI. See the note in backend-deployment.yaml.
          image: projectcamp-frontend
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Static file serving has no external dependency, so liveness and
          # readiness are the same shallow check.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          volumeMounts:
            # nginx writes its pid and temporary bodies even when only serving
            # static files, so a read-only root needs these three mounts.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
