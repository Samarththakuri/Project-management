# Local stand-in for the AWS Application Load Balancer.
#
# Its only job is to reproduce the production path split so that what you test on
# a laptop matches what the Ingress does in EKS:
#
#     /api/*  -> backend Service   (ALB rule 1)
#     /*      -> frontend Service  (ALB rule 2, default)
#
# Getting this wrong locally is the single easiest way to be surprised in
# production, because the SPA calls a relative "/api/v1" and sends cookies.

server {
    listen 80;
    server_name _;

    # The API. Note the trailing slashes are absent on purpose: the backend mounts
    # its routers at /api/v1/..., so the prefix must be forwarded unchanged.
    location /api {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else is the SPA.
    location / {
        proxy_pass         http://frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
