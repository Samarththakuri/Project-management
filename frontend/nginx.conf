# Server block for the built SPA.
#
# This container serves static files and nothing else. It deliberately contains no
# proxy_pass to the API: the ALB Ingress splits traffic by path (/api -> backend,
# / -> here), so both services sit on the same origin without an extra hop. That
# same-origin property is required, because src/api/axios.js hardcodes
# baseURL "/api/v1" and sends cookies with withCredentials.

server {
    # nginx-unprivileged runs as a non-root user and therefore cannot bind :80.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in responses.
    server_tokens off;

    # Directory traversal and byte-range abuse guards.
    client_max_body_size 1m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # ALB target-group health check and the Kubernetes probes both hit this.
    # Kept above the SPA fallback so it can never be swallowed by try_files.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets, so these are safe to cache
    # forever. This is what makes a redeploy cheap for returning users.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html is the one file that must never be cached: it is the document that
    # points at the new hashed bundles after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback. react-router uses createBrowserRouter (HTML5 history), so deep
    # links such as /projects/:id/board, /verify-email/:token and
    # /reset-password/:token are not real files. Without this they would 404 -
    # and the emailed verification and reset links are exactly those routes.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
