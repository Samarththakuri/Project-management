# SonarQube configuration for the Project Camp monorepo.
#
# The repository holds two independent npm packages with no workspace tooling, so
# this is a multi-module project: one Sonar module per package. Each module points
# at its own sources, tests and LCOV report, which keeps the coverage figures
# attributable instead of averaged into a single meaningless number.
#
# sonar.host.url and sonar.token are NOT set here. They are supplied by CI from
# GitHub secrets (SONAR_HOST_URL, SONAR_TOKEN) so that no credential and no
# environment-specific URL is ever committed.

sonar.projectKey=Samarththakuri_Project-management
sonar.projectName=Project Camp
sonar.projectVersion=1.0.0

# Required by SonarCloud, meaningless to a self-hosted SonarQube. Uncomment and
# set it to the SonarCloud organization key when using sonarcloud.io, and set
# sonar.projectKey above to the key SonarCloud generated (it namespaces project
# keys as <organization>_<repository>). Leaving this commented keeps the file
# valid for a self-hosted server. See docs/cicd/RUNBOOK.md section 3.
#
sonar.organization=samarththakuri-1

sonar.sourceEncoding=UTF-8

sonar.modules=backend,frontend

# ---------------------------------------------------------------------------
# Backend: Express 5 API
# ---------------------------------------------------------------------------
backend.sonar.projectName=Project Camp - Backend
backend.sonar.projectBaseDir=backend
backend.sonar.sources=src
backend.sonar.tests=tests
backend.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ---------------------------------------------------------------------------
# Frontend: Vite + React SPA
# ---------------------------------------------------------------------------
frontend.sonar.projectName=Project Camp - Frontend
frontend.sonar.projectBaseDir=frontend
frontend.sonar.sources=src
frontend.sonar.tests=src
frontend.sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ---------------------------------------------------------------------------
# Global exclusions
#
# Analysing generated or vendored code produces noise that drowns real findings
# and distorts the duplication metric.
# ---------------------------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/public/**,\
  **/*.min.js,\
  backend/scripts/data/**,\
  infra/**,\
  k8s/**,\
  argocd/**

# Test files are analysed for correctness but must not count toward coverage of
# themselves, and their duplication is expected (arrange/act/assert repeats).
sonar.coverage.exclusions=\
  **/*.test.js,\
  **/*.test.jsx,\
  **/tests/**,\
  backend/src/index.js,\
  backend/scripts/**,\
  frontend/vite.config.js,\
  frontend/vitest.config.js,\
  frontend/tailwind.config.js,\
  frontend/postcss.config.js,\
  frontend/eslint.config.js

sonar.cpd.exclusions=**/*.test.js,**/*.test.jsx
